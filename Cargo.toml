[workspace]
resolver = "3"
members = ["crucible","crucible-core"]

[workspace.package]
edition = "2024"
authors = ["Stuart Bruce"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
