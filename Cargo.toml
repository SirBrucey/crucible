[workspace]
resolver = "3"
members = ["crucible", "crucible-core", "crucible-dsl", "crucible-engine", "crucible-kind", "crucible-kind-amqp", "crucible-plugin", "crucible-protocol", "crucible-proxy", "crucible-span-rust"]
exclude = ["examples"]

[workspace.package]
edition = "2024"
authors = ["Stuart Bruce"]
publish = false
# FIXME: Decide on licensing
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
amq-protocol = { version = "10", default-features = false }
ariadne = "0.6"
axum = "0.8"
bollard = "0.21"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
libc = "0.2"
postcard = { version = "1", default-features = false }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rstest = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
