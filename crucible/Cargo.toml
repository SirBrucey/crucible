[package]
name = "crucible"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

# Two binaries from one crate, so a change to the protocol they speak rebuilds
# both or neither.
[[bin]]
name = "crucible"
path = "src/runner/main.rs"

[[bin]]
name = "crucible-worker"
path = "src/worker/main.rs"

[dependencies]
clap = { workspace = true }
crucible-core = { path = "../crucible-core" }
crucible-dsl = { path = "../crucible-dsl" }
crucible-engine = { path = "../crucible-engine" }
crucible-plugin = { path = "../crucible-plugin" }
libc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
