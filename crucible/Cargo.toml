[package]
name = "crucible"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true
description = "Property-driven fault injection for event-driven microservice fleets"

# Two binaries from one crate, so a change to the protocol they speak rebuilds
# both or neither.
[[bin]]
name = "crucible"
path = "src/runner/main.rs"

[[bin]]
name = "crucible-worker"
path = "src/worker/main.rs"

[dependencies]
clap = { workspace = true }
crucible-core = { path = "../crucible-core" }
crucible-dsl = { path = "../crucible-dsl" }
crucible-engine = { path = "../crucible-engine" }
crucible-plugin = { path = "../crucible-plugin", features = ["framework"] }
libc = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Stuart Bruce <programming@brucey.me.uk>"
section = "devel"
priority = "optional"
extended-description = "Crucible drives a fleet through a scenario, breaks it at points it learned from the fleet's own traffic, and reports which of the scenario's expectations no longer hold."
# The deployment plugin shipped here brings a fleet up as containers; another
# deployment plugin would want something else.
recommends = "docker.io"
# Only `crucible` is a command. The worker is spawned by it, so it lives in the
# package's own directory rather than on PATH.
assets = [
    ["target/release/crucible", "usr/bin/", "755"],
    ["target/release/crucible-worker", "usr/lib/crucible/", "755"],
    ["README.md", "usr/share/doc/crucible/", "644"],
]
