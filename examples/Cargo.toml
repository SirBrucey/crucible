[workspace]
resolver = "3"
members = [
    "orders/1_base/api",
    "orders/1_base/inventory",
    "orders/2_outbox/api",
    "orders/2_outbox/inventory",
    "orders/3_inbox/api",
    "orders/3_inbox/inventory",
    "orders/4_reconnect/api",
    "orders/4_reconnect/inventory",
    "orders/5_ack_on_success/api",
    "orders/5_ack_on_success/inventory",
    "orders/6_confirm/api",
    "orders/6_confirm/inventory",
    "orders/7_sequence/api",
    "orders/7_sequence/inventory",
    "pdns/api",
]
exclude = ["orders/local_first"]

[workspace.package]
edition = "2024"
authors = ["Stuart Bruce"]
publish = false
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
lapin = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
