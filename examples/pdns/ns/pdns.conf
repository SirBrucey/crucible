# The database is reached by service name, which inside the fleet is the proxy
# fronting it, so what the nameserver asks its database is traffic a fault can
# be anchored to.
launch=gmysql
gmysql-host=db
gmysql-port=3306
gmysql-user=root
gmysql-dbname=pdns

local-address=0.0.0.0
local-port=53

# Nothing else answers for this zone, so there is nothing to consult and no
# reason to hold an answer: a reading should see what the database holds now.
resolver=no
cache-ttl=0
negquery-cache-ttl=0
query-cache-ttl=0
